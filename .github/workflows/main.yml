
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project folder
        run: |
          ls -la
          ls -la "block blast apk"
          test -f "block blast apk/package.json"

      - name: Install dependencies
        run: cd "block blast apk" && npm install

      - name: Add Android platform
        run: cd "block blast apk" && npx cap add android

      - name: Install native Android files
        run: |
          cd "block blast apk"

          PACKAGE_DIR="android/app/src/main/java/com/blockblast/aisolver"
          mkdir -p "$PACKAGE_DIR"

          cp native/android/ScreenCapturePlugin.java "$PACKAGE_DIR/"
          cp native/android/ScreenCaptureService.java "$PACKAGE_DIR/"
          cp native/android/OverlayPlugin.java "$PACKAGE_DIR/"
          cp native/android/OverlayService.java "$PACKAGE_DIR/"
          cp native/android/MainActivity.java "$PACKAGE_DIR/"
          echo "OverlayPlugin dosyası kontrol ediliyor:"
          ls -l "$PACKAGE_DIR/OverlayPlugin.java"

      - name: Configure Android manifest
        run: |
          cd "block blast apk"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
          ]

          for permission in permissions:
              if permission not in content:
                  content = content.replace(
                      '<application',
                      '    ' + permission + '\n    <application',
                      1
                  )

          services = [
              """
              <service
                  android:name="com.blockblast.aisolver.ScreenCaptureService"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection" />
              """,
              """
              <service
                  android:name="com.blockblast.aisolver.OverlayService"
                  android:exported="false" />
              """
          ]

          for service in services:
              if service.strip().split('"')[1] not in content:
                  content = content.replace(
                      '</application>',
                      service + '\n    </application>',
                      1
                  )

          manifest.write_text(content)
          PY

      - name: Verify native Java files
        run: |
          cd "block blast apk"

          echo "JAVA FILES:"
          find android/app/src/main/java -name "*.java"

          echo "CHECK REQUIRED FILES:"
          test -f android/app/src/main/java/com/blockblast/aisolver/ScreenCapturePlugin.java
          test -f android/app/src/main/java/com/blockblast/aisolver/ScreenCaptureService.java
          test -f android/app/src/main/java/com/blockblast/aisolver/OverlayPlugin.java
          test -f android/app/src/main/java/com/blockblast/aisolver/OverlayService.java
          test -f android/app/src/main/java/com/blockblast/aisolver/MainActivity.java

          echo "MANIFEST:"
          grep -E "SYSTEM_ALERT_WINDOW|ScreenCaptureService|OverlayService" android/app/src/main/AndroidManifest.xml

      - name: Sync Android
        run: cd "block blast apk" && npx cap sync android

      - name: Build APK
        run: |
          cd "block blast apk/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Blast-AI-APK
          path: "block blast apk/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
