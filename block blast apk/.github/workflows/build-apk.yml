
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project folder
        run: |
          pwd
          ls -la
          ls -la "block blast apk"
          test -f "block blast apk/package.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          cd "block blast apk"
          npm install

      - name: Add Android platform
        run: |
          cd "block blast apk"
          npx cap add android

      - name: Sync Android
        run: |
          cd "block blast apk"
          npx cap sync android

      - name: Build APK
        run: |
          cd "block blast apk/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block-Blast-AI-APK
          path: "block blast apk/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
